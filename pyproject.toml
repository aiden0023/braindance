[project]
name = "braindance"
version = "0.1.0"
description = "A deck analysis engine for Cyberpunk TCG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
braindance = "braindance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["braindance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
